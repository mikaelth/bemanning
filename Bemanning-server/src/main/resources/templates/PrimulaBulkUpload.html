<html lang="se-SE">
	<head>
		<title th:text="#{display.bp.teupdateresult.title}">Uppdatering av antal registrerade studenter</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    	<link th:href="@{/styles/main.css}" rel="stylesheet" />
	</head>
	<body>
		<div id="container">
			<div id="content">
				<div>
					<h1 th:text="#{display.bp.primulaupdateresult.title}" />
<!--
					<h1 th:text="#{display.bp.teupdateresult.title} + ', ' + ${year}" />
					<h1 th:text="${year}" />
 -->
				</div>
		<div>
			<h2 th:text="'Sorterat på person'" />
			<table id = "course_instances_update">
				<tr>
					<th>Persnnummer</th>
					<th>Lönekostnad per timma</th>

					<th>Uppdaterad</th>

				</tr>
				<tr th:each="te: ${primulaEntries}">
					<td class='alnleft' th:text="${te.pNINForLdap()}" />
					<td class='alnleft' th:text="${te.hourlyCost()}" />

					<td class='alnleft' th:text="${te.updated}  ? 'X' : ' '"</>

				</tr>
			</table>
		</div>
				<div class="footer">
					<p th:text="'BP ' + #{build.release.minor}+ ', build ' + #{build.timestamp}" />
				</div>
			</div>
		</div>
	</body>
</html>
