# CAS Server Configuration
cas.server.url=https://weblogin.uu.se/idp/profile/cas
cas.server.login.url=https://weblogin.uu.se/idp/profile/cas/login
cas.server.logout.url=https://cas.uu.se/cas/logout

# Application Server Configuration
app.server.url=@bemanning.baseurl@
app.service.security=bemanning

# Security Configuration
security.require-ssl=false

# Profile Configuration
# Use 'basic' profile if you have issues with Apereo CAS client dependencies
# spring.profiles.active=basic

# Security Test Configuration
# Enable test endpoints for security verification
# security.test.enabled=true

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Logging Configuration for Security
logging.level.org.springframework.security=DEBUG
logging.level.org.apereo.cas.client=DEBUG
logging.level.se.uu.ebc.bemanning.security=DEBUG