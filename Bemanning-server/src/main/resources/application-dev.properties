debug=true
logging.level.root=WARN
logging.level.org.springframework.data.rest=ERROR
logging.level.org.springframework=ERROR
#logging.level.se.uu.ebc.bemanning.entity.Staff=ERROR
logging.level.se.uu.ebc.bemanning=DEBUG
logging.level.org.modelmapper=DEBUG
#
server.error.include-stacktrace=always
#
logging.level.org.modelmapper.ModelMapper=DEBUG

logging.path=/tmp/bemannning
#
# Vaadin does not work correctly with lazy initialization (its servlet/dev-server
# bootstrapping needs eager init), so keep it disabled in dev.
spring.main.lazy-initialization=false
#
bemanning.environment.dev=true
bemanning.environment.dev.cas.on=false
#
management.endpoint.shutdown.enabled=true
management.endpoint.restart.enabled=true
#
management.endpoint.beans.id=springbeans
management.endpoint.beans.sensitive=false
management.endpoint.beans.enabled=true
#
# The Vaadin servlet MUST be mapped to the root context (/*, the default) when
# React routing is enabled (react.enable=true, the default in Vaadin 24.4+/25).
# The React Router client is created with a wildcard route and a basename taken
# from document.baseURI; a custom vaadin.url-mapping like /ui/* interferes with
# those wildcard routes and with /VAADIN static-resource resolution, so the Flow
# client cannot open its UIDL/heartbeat/push connection -> "Connection lost,
# trying to reconnect". We therefore keep the default root mapping and resolve
# the collision with the legacy root @RequestMapping in Bemanning.java instead
# (that redirect was removed; the ExtJS SPA is reached via /index.html directly).
#
bemanning.base.url=http://localhost:8081
luntan.rest.base.url = http://localhost:8080/rest/
#
server.port=8081
#
# Spring DevTools auto-restart conflicts with Vaadin: when Vaadin generates its
# frontend bundle, DevTools restarts the app and the new instance tries to
# re-bind the port before the old connector releases it (PortInUseException),
# killing the session ("Connection lost"). Vaadin provides its own live reload,
# so DevTools restart is disabled here.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
#
spring.datasource.url=jdbc\:mysql\://localhost\:3306/bemanning-5?useLegacyDatetimeCode=false&serverTimezone=CET
#
spring.datasource.username=@jdbc.username.dev@
spring.datasource.password=@jdbc.password.dev@
