debug=false
logging.level.root=WARN
logging.level.org.springframework.data.rest=ERROR
logging.level.se.uu.ebc.bemanning=ERROR
logging.path=/tmp/bemanning
#
bemanning.environment.dev=false
bemanning.environment.dev.cas.on=true
app.server.url=https://bp5.ibg.uu.se
app.service.security=bemanning
#
management.endpoint.restart.enabled=true
management.endpoint.shutdown.enabled=false
endpoints.shutdown.enabled=false
spring.devtools.restart.enabled=false
#
bemanning.base.url=@bemanning.baseurl@
#
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
#
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#
spring.datasource.url=jdbc\:mysql\://localhost\:3306/bp5?useLegacyDatetimeCode=false&serverTimezone=CET
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#
spring.datasource.username=@jdbc.username.prod@
spring.datasource.password=@jdbc.password.prod@
#
